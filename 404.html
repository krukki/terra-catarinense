<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Página não encontrada — Terra Catarinense</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg?v=2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Inter:wght@400;600&display=swap" rel="stylesheet">

  <!-- Página de erro simples: o CSS fica aqui dentro, para ela funcionar
       em qualquer endereço errado, sem depender de outros arquivos -->
  <style>
    :root {
      --fundo: #F3EEE4;
      --texto: #1B1F1D;
      --suave: #5A5A52;
      --destaque: #A63D25;
      color-scheme: light dark;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --fundo: #0F1614;
        --texto: #EAE3D4;
        --suave: #A9A392;
      }
    }

    * { margin: 0; box-sizing: border-box; }

    body {
      display: grid;
      place-items: center;
      min-height: 100svh;
      padding: 1.5rem;
      background-color: var(--fundo);
      color: var(--texto);
      font-family: Inter, system-ui, sans-serif;
      line-height: 1.6;
      text-align: center;
    }

    main { max-width: 30rem; }

    .codigo {
      font-family: Fraunces, Georgia, serif;
      font-size: clamp(5rem, 22vw, 9rem);
      font-weight: 500;
      line-height: 1;
      color: var(--destaque);
    }

    @media (prefers-color-scheme: dark) {
      .codigo { color: #E58A6C; }
    }

    h1 {
      margin-top: 1rem;
      font-family: Fraunces, Georgia, serif;
      font-size: 1.6rem;
      font-weight: 500;
      line-height: 1.25;
    }

    p {
      margin-top: 0.75rem;
      color: var(--suave);
    }

    a {
      display: inline-block;
      margin-top: 1.75rem;
      padding: 0.8rem 1.4rem;
      background-color: var(--destaque);
      color: #FFFFFF;
      font-weight: 600;
      text-decoration: none;
    }

    a:hover { filter: brightness(1.1); }

    a:focus-visible {
      outline: 0.1875rem solid var(--texto);
      outline-offset: 0.1875rem;
    }
  </style>
</head>
<body>
  <main>
    <p class="codigo" aria-hidden="true">404</p>
    <h1>Página não encontrada</h1>
    <p>O endereço que você abriu não existe ou mudou de lugar.</p>
    <a href="index.html">Voltar ao início</a>
  </main>
</body>
</html>
